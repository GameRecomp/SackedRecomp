# Time mode, the first character, the first level of the map, its briefing: into the level.
# Coordinates at 800x600; the game moves its own pointer by DirectInput's relative motion, so
# every target is reached by moves from where the pointer was. Buttons light up (and take a
# click) only while the pointer moves over them.
FRAMES=2110
INPUT=firstlevel.input
SCREENSHOT=2100
TIMEOUT=300
