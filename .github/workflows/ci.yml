# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recomp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: recomp
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: cli smoke test
        run: cargo run --release -p rc-cli -- --version
      # Lifted C against the real CPU in 32-bit mode (clang -m32, no 32-bit libc needed).
      - name: difftest
        run: cargo run --release -p rc-difftest

  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - run: ctest --preset ci
